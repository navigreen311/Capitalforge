name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
    # All four are listed because naming `types` REPLACES the default set
    # rather than adding to it. The defaults are opened, synchronize and
    # reopened; writing `types: [edited]` alone would stop CI running when a
    # branch is pushed to, which is the case that matters most.
    #
    # `edited` is here for stacked pull requests. A PR based on another branch
    # does not match the `branches` filter above, so it gets no run at all —
    # and retargeting it to master fires `edited`, which is not a default type,
    # so it got no run then either. #75 reached a merge attempt having never
    # been tested once, carrying a test that failed the first time it ran.
    #
    # Cost: `edited` also fires on title and body edits, so editing a
    # description queues a full run. The concurrency group above cancels the
    # previous one, so rapid edits collapse rather than stack.
    types:
      - opened
      - synchronize
      - reopened
      - edited

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DATABASE_URL: postgresql://capitalforge:capitalforge_dev@localhost:5432/capitalforge_test
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-access-secret-minimum-32-characters-long
  JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-characters-long
  JWT_ACCESS_EXPIRY: 15m
  JWT_REFRESH_EXPIRY: 7d
  NODE_ENV: test
  ENCRYPTION_KEY: ci-aes256-key-exactly-32-bytes-!!
  STORAGE_PROVIDER: local
  PORT: 4000

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 0: Detect a documentation-only change
  #
  # The browser suite takes about 23 minutes. A pull request that only
  # edits docs/ was paying that in full, so this decides whether the
  # e2e-tests job below has anything to test.
  #
  # Two design choices carry the safety, and both are deliberate:
  #
  # 1. This is a DENY-list, never an allow-list. `paths-ignore` style
  #    reasoning fails safe: a path nobody anticipated — a new top-level
  #    package, a new service directory — does not match the docs pattern
  #    and therefore runs the suite. The inverse (`paths: ['src/**']`)
  #    fails OPEN: anything outside the list is skipped silently, which
  #    is how a real code change gets no browser coverage.
  #
  # 2. This is a job-level `if:`, not a workflow-level `paths-ignore`.
  #    A workflow filtered at the top never starts, so its checks never
  #    report. `master` had NO branch protection when this was written
  #    (verified 2026-08-05), but the moment somebody enables it, a
  #    required "Browser Tests" check that never reports leaves every
  #    docs PR stuck on "Expected — waiting for status" forever. A job
  #    skipped by `if:` reports as skipped, which branch protection
  #    accepts. Whoever turns protection on should not have to
  #    rediscover this: it already works, and this is why.
  #
  # Every ambiguity runs the suite — push events carry no PR context, and
  # an empty or failed diff tells us nothing.
  #
  # HONEST LIMITATION: this trusts that a change touching only docs/
  # cannot affect runtime behaviour. Nothing under src/ or tests/ reads a
  # file from docs/ today (checked 2026-08-05). If that ever changes,
  # this filter becomes wrong silently — nothing here would catch it.
  # ─────────────────────────────────────────────────────────────
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare changed paths
        id: check
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # No PR context (push to master), so run everything.
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "No pull-request context — running the full suite."
            exit 0
          fi

          if ! FILES=$(git diff --name-only "$BASE" "$HEAD"); then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Could not diff — running the full suite."
            exit 0
          fi

          if [ -z "$FILES" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Empty diff — running the full suite."
            exit 0
          fi

          echo "Changed files:"
          echo "$FILES"

          # One path outside docs/ or a ROOT-level .md is enough to run.
          # Deliberately `[^/]+\.md$` and not `**/*.md`: a markdown file
          # under src/ or tests/ may be a fixture something reads.
          if echo "$FILES" | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Code paths changed — running the full suite."
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Documentation only — the browser suite will be skipped."
          fi

  # ─────────────────────────────────────────────────────────────
  # Job 1: Lint & Type Check
  # Runs without any service containers — fast feedback on
  # code quality before heavier test jobs run.
  # ─────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      # Shipped code is checked with noUncheckedIndexedAccess on top of the
      # root config. Tests keep the looser settings — see tsconfig.src.json.
      - name: Type check src with noUncheckedIndexedAccess
        run: npm run typecheck:src

      # This job installs with a plain `npm ci`, so devDependencies are
      # present and a runtime import of one resolves here exactly as it
      # does on a developer's machine. The production image installs with
      # `npm ci --omit=dev` and does not. Nothing else in CI can see that
      # difference, which is why a broken /api/docs/openapi.json survived
      # every job for as long as it did.
      #
      # A step in this job rather than a job of its own: branch protection
      # requires a fixed set of named checks, and a new job would not be
      # among them, so its failures would not block a merge.
      - name: Check production imports resolve without devDependencies
        run: npm run check:prod-imports

      # A test named "for each" with one item in the fixture cannot fail the way
      # its name implies. See docs/OVERSTATED_TESTS.md.
      - name: Check tests assert what their names claim
        run: npm run check:test-claims

      # A handler taking a business id that nothing ties to the caller's tenant.
      # The mount guard covers /businesses/:id and /clients/:clientId; this is
      # what covers everything else. See docs/TENANCY.md.
      - name: Check business ids are scoped to the caller's tenant
        run: npm run check:route-tenancy

      # A document, export or report whose figures were never queried. Five of
      # these have been found; this is so the sixth fails here.
      - name: Check document figures come from somewhere
        run: npm run check:document-provenance

  # ─────────────────────────────────────────────────────────────
  # Job 2: Unit Tests
  # Fast tests that do not require database or Redis.
  # ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      # tests/e2e — six mocked flow suites, 81 assertions, which no CI job ran
      # until 2026-08-07. They pass without a database, so they belong here
      # rather than in the integration job. See tests/unit/runner-coverage.test.ts,
      # which fails if a test directory ever goes unrun again.
      - name: Run flow tests
        run: npm run test:e2e

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 3: Integration Tests
  # Requires PostgreSQL and Redis service containers.
  # Runs Prisma migrations against the test database before tests.
  # ─────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: capitalforge_test
          POSTGRES_USER: capitalforge
          POSTGRES_PASSWORD: capitalforge_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capitalforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload integration test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 4: Browser tests (Playwright)
  #
  # These ran only on the machine they were written on. Everything the
  # end-to-end suite guards — that a page states no figure it does not have,
  # that a write survives a re-read, that a tenant cannot reach another
  # tenant's records — was verified by somebody remembering to run it locally.
  #
  # The suite needs a database with the seed in it, because the assertions
  # compare what a page renders against what the API returns rather than
  # against fixtures. Migrations and a seed run before it for that reason.
  #
  # Playwright starts both servers itself (see webServer in
  # playwright.config.ts) and, with CI set, always starts them fresh rather
  # than attaching to whatever is listening.
  # ─────────────────────────────────────────────────────────────
  e2e-tests:
    name: Browser Tests
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - changes
    # Skipped only when every changed path is docs/ or a root-level .md.
    # See the `changes` job for why this is a job-level condition rather
    # than a workflow-level paths-ignore.
    if: needs.changes.outputs.docs_only != 'true'
    # The suite takes about eight minutes locally; the first request to each
    # route also pays for a dev-server compile, which global setup does up
    # front. This is a ceiling, not an expectation.
    timeout-minutes: 30

    env:
      # The workflow sets NODE_ENV=test for the vitest jobs. Next treats any
      # value other than development or production as non-standard, and these
      # are the same dev servers the suite runs against locally.
      NODE_ENV: development

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: capitalforge_test
          POSTGRES_USER: capitalforge
          POSTGRES_PASSWORD: capitalforge_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capitalforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      # The suite asserts against seeded records by name and id — the client
      # with a business credit file, the one without, the funding round, the
      # card benefits. Without this it fails on its preconditions rather than
      # on anything real.
      - name: Seed the database
        run: npm run db:seed

      # Seeds a second time and asserts nothing changed. A seed that cannot run
      # twice cannot be run on a database that already has data, which is every
      # environment except a brand new one — and the failure surfaces as a
      # constraint violation halfway through, leaving the database part-seeded.
      #
      # This runs after the seed above rather than in place of it: the E2E suite
      # needs the seeded database, and this needs a database that has been
      # seeded once. Both are served by running it here.
      #
      # Note what it does not cover. It runs against a database CI built from
      # nothing, so it cannot see a defect that only appears once one-off data
      # scripts have been applied — which is exactly how db:seed was broken on
      # 2026-08-03. Seeding the database you changed, before commit, is the only
      # thing that reaches that. See docs/backlog/incident-2026-08-03-broken-seed.md.
      - name: Check the seed is idempotent
        run: npm run db:seed:check

      # Chromium only: the suite declares no other browser, and installing
      # three costs minutes per run for coverage nothing asks for.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:playwright

      # Traces are retain-on-failure, so this is empty on a green run. A
      # failure that happens once in twenty runs is only diagnosable if the
      # trace outlives the job.
      - name: Upload traces and failure snapshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Job 4: Build Check
  # Verifies the project builds cleanly for both backend and
  # frontend. Runs after tests pass.
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - e2e-tests
    # Required because `needs` includes e2e-tests, which is skipped on a
    # docs-only change — and GitHub skips a job whose dependency was
    # skipped. Without this, filtering the browser suite would silently
    # take the build with it. Still fails if any dependency actually
    # failed; `!cancelled()` keeps a skipped dependency from counting.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build backend
        run: npm run build:backend

      # build:frontend defaults to .next-build, which no dev server owns.
      # The upload step below names src/frontend/.next/, so this job asks
      # for it explicitly rather than relying on the script to infer that
      # it is running in CI.
      - name: Build frontend
        run: npm run build:frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
          NEXT_DIST_DIR: .next

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            src/frontend/.next/
          retention-days: 3
