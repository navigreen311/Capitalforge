name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DATABASE_URL: postgresql://capitalforge:capitalforge_dev@localhost:5432/capitalforge_test
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-access-secret-minimum-32-characters-long
  JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-characters-long
  JWT_ACCESS_EXPIRY: 15m
  JWT_REFRESH_EXPIRY: 7d
  NODE_ENV: test
  ENCRYPTION_KEY: ci-aes256-key-exactly-32-bytes-!!
  STORAGE_PROVIDER: local
  PORT: 4000

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Lint & Type Check
  # Runs without any service containers — fast feedback on
  # code quality before heavier test jobs run.
  # ─────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────
  # Job 2: Unit Tests
  # Fast tests that do not require database or Redis.
  # ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 3: Integration Tests
  # Requires PostgreSQL and Redis service containers.
  # Runs Prisma migrations against the test database before tests.
  # ─────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: capitalforge_test
          POSTGRES_USER: capitalforge
          POSTGRES_PASSWORD: capitalforge_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capitalforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload integration test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 4: Browser tests (Playwright)
  #
  # These ran only on the machine they were written on. Everything the
  # end-to-end suite guards — that a page states no figure it does not have,
  # that a write survives a re-read, that a tenant cannot reach another
  # tenant's records — was verified by somebody remembering to run it locally.
  #
  # The suite needs a database with the seed in it, because the assertions
  # compare what a page renders against what the API returns rather than
  # against fixtures. Migrations and a seed run before it for that reason.
  #
  # Playwright starts both servers itself (see webServer in
  # playwright.config.ts) and, with CI set, always starts them fresh rather
  # than attaching to whatever is listening.
  # ─────────────────────────────────────────────────────────────
  e2e-tests:
    name: Browser Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    # The suite takes about eight minutes locally; the first request to each
    # route also pays for a dev-server compile, which global setup does up
    # front. This is a ceiling, not an expectation.
    timeout-minutes: 30

    env:
      # The workflow sets NODE_ENV=test for the vitest jobs. Next treats any
      # value other than development or production as non-standard, and these
      # are the same dev servers the suite runs against locally.
      NODE_ENV: development

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: capitalforge_test
          POSTGRES_USER: capitalforge
          POSTGRES_PASSWORD: capitalforge_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capitalforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      # The suite asserts against seeded records by name and id — the client
      # with a business credit file, the one without, the funding round, the
      # card benefits. Without this it fails on its preconditions rather than
      # on anything real.
      - name: Seed the database
        run: npm run db:seed

      # Seeds a second time and asserts nothing changed. A seed that cannot run
      # twice cannot be run on a database that already has data, which is every
      # environment except a brand new one — and the failure surfaces as a
      # constraint violation halfway through, leaving the database part-seeded.
      #
      # This runs after the seed above rather than in place of it: the E2E suite
      # needs the seeded database, and this needs a database that has been
      # seeded once. Both are served by running it here.
      #
      # Note what it does not cover. It runs against a database CI built from
      # nothing, so it cannot see a defect that only appears once one-off data
      # scripts have been applied — which is exactly how db:seed was broken on
      # 2026-08-03. Seeding the database you changed, before commit, is the only
      # thing that reaches that. See docs/backlog/incident-2026-08-03-broken-seed.md.
      - name: Check the seed is idempotent
        run: npm run db:seed:check

      # Chromium only: the suite declares no other browser, and installing
      # three costs minutes per run for coverage nothing asks for.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:playwright

      # Traces are retain-on-failure, so this is empty on a green run. A
      # failure that happens once in twenty runs is only diagnosable if the
      # trace outlives the job.
      - name: Upload traces and failure snapshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Job 4: Build Check
  # Verifies the project builds cleanly for both backend and
  # frontend. Runs after tests pass.
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - e2e-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build:frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            src/frontend/.next/
          retention-days: 3
